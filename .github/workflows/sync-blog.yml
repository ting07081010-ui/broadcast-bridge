name: Sync blog from Notion

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run sync
        id: sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BLOG_DATABASE_ID: ${{ secrets.NOTION_BLOG_DATABASE_ID }}
        run: |
          set +e
          npm run sync:blog > "$RUNNER_TEMP/sync-blog.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/sync-blog.log"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Open a PR when content changed
        # 結束碼 2：先為已轉換的文章開 PR，再由下一步把工作標成失敗。
        # 結束碼 1：整批失敗，快照不提交。
        if: steps.sync.outputs.code == '0' || steps.sync.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_CODE: ${{ steps.sync.outputs.code }}
        run: |
          # syncedAt changes every run, so compare posts and media only
          if git diff --quiet -I'"syncedAt"' -- src/content/blog public/blog/media && [ -z "$(git ls-files --others --exclude-standard public/blog/media)" ]; then
            echo "No content changes."
            exit 0
          fi
          branch="sync/blog-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/content/blog
          if [ -d public/blog/media ]; then git add public/blog/media; fi
          git commit -m "chore(blog): sync from Notion"
          git push origin "$branch"
          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Automatic sync from the Notion CMS. Review the snapshot, then merge to publish."
            if [ "$SYNC_CODE" = "2" ]; then
              echo
              echo "## Blocked posts"
              echo
              echo "These posts were not updated from Notion. If a previous snapshot exists, it is kept. Fix them in Notion and sync again."
              echo
              grep '^阻擋 ' "$RUNNER_TEMP/sync-blog.log" | sed 's/^阻擋 /- /' || true
            fi
          } > "$body"
          gh pr create --base main --head "$branch" \
            --title "chore(blog): sync from Notion" \
            --body-file "$body"
      - name: Fail on blocked or failed sync
        if: steps.sync.outputs.code != '0'
        run: |
          echo "sync-blog exited with code ${{ steps.sync.outputs.code }} (1 = error, 2 = some posts blocked). See the Run sync step log."
          exit 1
