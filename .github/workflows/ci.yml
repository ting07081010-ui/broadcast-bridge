name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test src/lib/blog/blog.test.ts src/lib/enian/feed.test.ts
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
